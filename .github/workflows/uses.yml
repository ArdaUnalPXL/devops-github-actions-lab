
name: Uses Examples

on:
  workflow_dispatch:

jobs:
  uses-example:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check Python version
        run: python --version

      - name: Run Python script
        run: python my_script.py
